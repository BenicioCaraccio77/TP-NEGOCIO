<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/admin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración</title>
</head>
<body>

    <nav class="nav">
        <a href="/">Inicio</a>
    </nav>

    <main>

        <div class="titulo">
            <h2>Administración de productos</h2>
            <button class="nuevo" onclick="nuevoProducto()">+ Nuevo producto</button>
        </div>

        <div id="formulario-producto" style="display: none">

            <h3 id="titulo-formulario">Nuevo producto</h3>

            <input type="text" id="nombre" placeholder="Nombre del producto">

            <select id="categoria">
                <option value="">Seleccionar categoría</option>
            </select>

            <input type="number" id="precio" placeholder="Precio">
            <input type="number" id="stock" placeholder="Stock">

            <button onclick="guardarProducto()">Guardar</button>
            <button onclick="cancelarFormulario()">Cancelar</button>

        </div>

        <table class="table">
            <thead class="thead">
                <tr class="tr">
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody class="tbody" id="lista-productos">
            </tbody>
        </table>

    </main>

    <script src="/admin.js"></script>

</body>
</html>
